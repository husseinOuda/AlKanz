<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">أيقونة برنامج الكنز</title>
  <desc id="desc">صندوق كنز يجمع بين التجارة والنمو بألوان الكحلي والتركوازي والأبيض</desc>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0C2444"/>
  <!-- Treasure chest lid -->
  <path d="M13 25.5 18.5 15h27L51 25.5Z" fill="#0E9C8A" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M18.5 15 13 25.5l5.8 3.2 5.7-10.2Z" fill="#FFFFFF"/>
  <!-- Growth bars -->
  <path d="M23 23v-5h4v5M30 23v-8h4v8M37 23V12h4v11" fill="#0E9C8A" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
  <!-- Chest body -->
  <path d="M12 27h40v20.5c0 2-1.6 3.5-3.5 3.5h-33c-1.9 0-3.5-1.5-3.5-3.5Z" fill="#FFFFFF"/>
  <path d="M15 30h34v16.5c0 1.1-.9 2-2 2H17c-1.1 0-2-.9-2-2Z" fill="#0C2444"/>
  <!-- Chest center seam -->
  <path d="M32 30v18" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Lock -->
  <rect x="27.5" y="34" width="9" height="10" rx="2" fill="#0E9C8A"/>
  <path d="M29.5 34v-2.2a3 3 0 0 1 6 0V34" fill="none" stroke="#0E9C8A" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="32" cy="38" r="1.2" fill="#FFFFFF"/>
  <path d="M32 39v2" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small POS / commerce mark -->
  <path d="M43 34h5.5l-1.2 5H44Z" fill="#FFFFFF" stroke="#0E9C8A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M42 32.5h2l.8 7.5" fill="none" stroke="#0E9C8A" stroke-width="1.7" stroke-linecap="round"/>
  <circle cx="44.5" cy="42" r="1.2" fill="#0E9C8A"/>
  <circle cx="48" cy="42" r="1.2" fill="#0E9C8A"/>
  <!-- Teal base accent -->
  <path d="M14 52.5c5 3.2 11.1 4.8 18 4.8s13-1.6 18-4.8" fill="none" stroke="#0E9C8A" stroke-width="3" stroke-linecap="round"/>
</svg>
